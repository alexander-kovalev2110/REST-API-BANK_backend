security:
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

  providers:
    app_user_provider:
      entity:
        class: App\Domain\Customer\Customer
        property: name

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    # ✅ Логин и Регистрация (ручной через контроллер)
    login:
      pattern: ^/customers/(login|register)
      stateless: true
      security: false  # потому что авторизация не требуется

    # ✅ Основной firewall для JWT
    main:
      pattern: ^/(customers|transactions)
      stateless: true
      provider: app_user_provider
      jwt: ~  # обработка Authorization: Bearer <token>
      entry_point: jwt  # важно для новых версий Symfony
      # entry_point: lexik_jwt_authentication.jwt_token_authenticator

  access_control:
    - { path: ^/customers/(login|register), roles: PUBLIC_ACCESS }
    - { path: ^/transactions, roles: ROLE_USER }